name: Android-APK

# Baut die APK bei einem Versions-Tag (v*) und hängt sie an das GitHub-Release.
# Releases bekommen immer eine Release-APK, signiert mit dem Schlüssel des Projekts (Repository-Secrets). Nur damit lassen sich
# Updates über die installierte App installieren, und nur diesen Namen (JF-Hub-<Version>-release.apk) verlinkt die App.
# Fehlt der Schlüssel, bricht ein Release ab. Von Hand gestartet (workflow_dispatch) entsteht ohne Schlüssel eine Debug-APK zum
# Ausprobieren; sie ist bei jedem Lauf anders signiert und lässt sich nicht über eine andere installieren.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   Keystore-Datei, base64-kodiert (base64 -w0 jf-hub.keystore)
#   ANDROID_KEYSTORE_PASSWORD Passwort des Keystores
#   ANDROID_KEY_ALIAS         Alias des Schlüssels
#   ANDROID_KEY_PASSWORD      Passwort des Schlüssels
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Der Tag muss zur Version im Code passen, sonst hieße die APK falsch und Android erkennte sie nicht als Update.
      - run: node ../scripts/version.mjs --check "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Der Standard „tools platform-tools“ scheitert: das Paket „tools“ gibt es in den neuen Command-line-Tools nicht mehr.
          packages: platform-tools
      - run: npm ci --no-audit --no-fund
      - run: chmod +x android/gradlew
      - name: Signierschlüssel bereitstellen
        id: keys
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE" | base64 -d > android/keystore/jf-hub.keystore
            printf 'storeFile=keystore/jf-hub.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
            echo "variant=release" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "::error::Kein Signierschlüssel hinterlegt. Ein Release braucht die Secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS und ANDROID_KEY_PASSWORD (siehe docs/android-app.md)."
            exit 1
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Kein Signierschlüssel hinterlegt – es entsteht eine Debug-APK (nur zum Ausprobieren)."
          fi
      - name: APK bauen
        run: |
          if [ "${{ steps.keys.outputs.variant }}" = "debug" ]; then npm run apk -- debug; else npm run apk; fi
      - name: Signatur prüfen
        # Fingerabdruck des Zertifikats in die Zusammenfassung: Er muss bei jedem Release gleich sein (steht auch in docs/android-app.md).
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in apk/*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs"
            { echo "### $(basename "$apk")"; echo "$certs" | grep -m1 'SHA-256' | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jf-hub-apk
          path: app/apk/*.apk
      - name: An das Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/apk/*.apk
          generate_release_notes: true
          # Release-Kandidaten (v2.2.0-rc.1) sind Vorabversionen und werden nicht zum „Latest“-Release.
          prerelease: ${{ contains(github.ref_name, '-') }}
