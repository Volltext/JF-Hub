name: Android-APK

# Baut die APK bei einem Versions-Tag (v*) und hängt sie an das GitHub-Release.
# Mit Signierschlüssel (Repository-Secrets) entsteht eine Release-APK, die Updates über die vorige Version erlaubt;
# ohne Schlüssel eine Debug-APK zum Ausprobieren.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   Keystore-Datei, base64-kodiert (base64 -w0 jf-hub.keystore)
#   ANDROID_KEYSTORE_PASSWORD Passwort des Keystores
#   ANDROID_KEY_ALIAS         Alias des Schlüssels
#   ANDROID_KEY_PASSWORD      Passwort des Schlüssels
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - run: chmod +x android/gradlew
      - name: Signierschlüssel bereitstellen
        id: keys
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE" | base64 -d > android/keystore/jf-hub.keystore
            printf 'storeFile=keystore/jf-hub.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Kein Signierschlüssel hinterlegt – es entsteht eine Debug-APK."
          fi
      - name: APK bauen
        run: |
          if [ "${{ steps.keys.outputs.variant }}" = "debug" ]; then npm run apk -- debug; else npm run apk; fi
      - uses: actions/upload-artifact@v4
        with:
          name: jf-hub-apk
          path: app/apk/*.apk
      - name: An das Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/apk/*.apk
          generate_release_notes: true
