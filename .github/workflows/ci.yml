name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (Typecheck, Tests, Web-Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  server:
    name: Server (Typecheck, Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Rauchtest im Browser (Playwright)
    runs-on: ubuntu-latest
    needs: [app, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
            e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm run build:web
        working-directory: app
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    name: Docker-Image baut und startet
    runs-on: ubuntu-latest
    needs: [app, server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: jf-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rauchtest
        run: |
          docker run -d --name jf-hub-ci -p 8080:8080 jf-hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/api/status | grep -q '"setupRequired":true'
          curl -fsS http://localhost:8080/ | grep -qi '<title>JF Hub'
          curl -fsS http://localhost:8080/sw.js | grep -q 'PRECACHE'
          curl -fsS http://localhost:8080/admin/ | grep -qi 'JF Hub'
      - if: failure()
        run: docker logs jf-hub-ci
